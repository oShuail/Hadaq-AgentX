# XcodeGen spec, a backup for Hadaq.xcodeproj. If the committed project does not open in your Xcode:
#   brew install xcodegen && cd apps/ios && xcodegen
name: Hadaq
options:
  bundleIdPrefix: sa.hadaq
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Hadaq:
    type: application
    platform: iOS
    sources:
      - path: Hadaq
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.hadaq.surveyor
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

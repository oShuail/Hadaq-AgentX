[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hadaq-agents"
version = "0.1.0"
description = "Hadaq agents: Orchestrator + Simulation and Advisory (LangGraph), verifier, chat API (owner: Omar)"
requires-python = ">=3.11"
dependencies = [
  "hadaq-schemas",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "langgraph>=1.0",
  "langchain>=1.0",
  "langchain-anthropic>=1.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["hadaq_agents*"]

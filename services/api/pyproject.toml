[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hadaq-api"
version = "0.1.0"
description = "Hadaq API gateway: REST + websocket + MQTT bridge + storage (owner: Turky)"
requires-python = ">=3.11"
dependencies = [
  "hadaq-schemas",
  "hadaq-sim",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlmodel>=0.0.16",
  "paho-mqtt>=2.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["hadaq_api*"]

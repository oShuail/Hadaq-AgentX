spring.application.name=Hadaq

# 8080 = the core API port in contracts/README.md (v2). The Python API (services/api) stays on 8000 until it is retired
server.port=${PORT:8080}

# database: defaults = local XAMPP (MariaDB 10.4, the server DataGrip shows). Every value can come from the environment.
# jdbc:mariadb keeps the microseconds of every time; the MySQL driver silently drops them on MariaDB.
# On a real MySQL server: DB_URL=jdbc:mysql://host:3306/hadaq_db?createDatabaseIfNotExist=true
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/hadaq_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# update: keeps the data between restarts (create-drop wipes it)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# every time is stored in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JSON in snake_case, exactly like contracts/README.md (sensor_id, building_id, evidence_id ...)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=false

# photos up to 20 MB (a 4000 px phone photo)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ---------------- Hadaq ----------------
# the building registry (walls, zones, sensors, cameras). Empty = contracts/building_b01.json, packed into the jar at build time
# point it at the repo file to always use the team's latest: HADAQ_REGISTRY=C:/.../Hadaq-AgentX/contracts/building_b01.json
hadaq.registry-path=${HADAQ_REGISTRY:}

# the address photos are served from (file_url in every Photo)
hadaq.public-url=${API_PUBLIC_URL:http://localhost:8080}
hadaq.photo-dir=${PHOTO_DIR:./data/photos}
hadaq.weather-cache-dir=${HADAQ_WEATHER_CACHE:./data/weather_cache}

# the agents service (Omar): storm_started, moisture_anomaly and detection_ready are forwarded to it
hadaq.agents-url=${AGENTS_URL:http://localhost:8100}
hadaq.agents-enabled=${AGENTS_ENABLED:true}

# one moisture_anomaly per sensor per 10 minutes at most
hadaq.anomaly-cooldown-seconds=${ANOMALY_COOLDOWN_S:600}

# a sensor with no reading for 30 s is "stale"
hadaq.sensor-stale-seconds=${SENSOR_STALE_S:30}

# hide faces in uploaded photos before they are stored (challenge criterion)
hadaq.privacy-blur=${PRIVACY_BLUR:true}

# Built-in demo (like the hosted demo at hadaq.vercel.app): simulated sensors, a simulated camera, a mock vision
# worker and a first storm simulation, all labelled "synthetic". DEMO_ENABLED=false turns everything off.
# Turn one part off when the real thing runs: DEMO_SENSORS=false (Python sensor_sim), DEMO_INCLUDE_REAL=false
# (the ESP32 brick node sends S01 to S03), DEMO_CAMERA=false (camera_sim / real photos), DEMO_VISION=false (RF-DETR worker)
hadaq.demo.enabled=${DEMO_ENABLED:true}
hadaq.demo.sensors=${DEMO_SENSORS:true}
hadaq.demo.include-real=${DEMO_INCLUDE_REAL:true}
hadaq.demo.camera=${DEMO_CAMERA:true}
hadaq.demo.vision=${DEMO_VISION:true}
hadaq.demo.seed-simulation=true
# 2 s per reading at 720x = one simulated day every two minutes (Saleh's two-minute run)
hadaq.demo.sensor-interval-seconds=2
hadaq.demo.speed=720
hadaq.demo.camera-interval-seconds=15
hadaq.demo.vision-interval-seconds=2

# MQTT broker (docker compose up mqtt). false = HTTP only, the API still works
mqtt.enabled=${MQTT_ENABLED:true}
mqtt.host=${MQTT_HOST:localhost}
mqtt.port=${MQTT_PORT:1883}

# CORS (comma separated, * = any origin)
cors.allowed-origins=${CORS_ORIGINS:*}

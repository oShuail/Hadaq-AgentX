# tests use their own database, wiped after every run: hadaq_db is never touched
spring.datasource.url=jdbc:mariadb://localhost:3306/hadaq_test_db?createDatabaseIfNotExist=true
spring.jpa.hibernate.ddl-auto=create-drop
mqtt.enabled=false
hadaq.demo.enabled=false
hadaq.agents-enabled=false
hadaq.photo-dir=./target/test-photos
hadaq.weather-cache-dir=./target/test-weather-cache
hadaq.capture-dir=./target/test-captures
hadaq.ai.mode=mock

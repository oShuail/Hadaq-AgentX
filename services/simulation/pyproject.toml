[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hadaq-sim"
version = "0.1.0"
description = "Hadaq simulation engine: weather, wall moisture model, ABC risk, monitoring rules (owner: Basma)"
requires-python = ">=3.11"
dependencies = ["hadaq-schemas", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["hadaq_sim*"]

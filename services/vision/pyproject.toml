[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hadaq-vision"
version = "0.1.0"
description = "Hadaq vision: RF-DETR-Seg defect detection, camera simulator, vision worker (owner: Abdurhmn)"
requires-python = ">=3.11"
dependencies = ["hadaq-schemas", "httpx>=0.27", "paho-mqtt>=2.0", "numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
rfdetr = ["rfdetr>=1.12", "supervision>=0.25"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["hadaq_vision*"]
